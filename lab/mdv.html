<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="canonical" href="https://nekuda-psik.com/lab/mdv.html">
<title>MD Viewer - קורא מסמכים</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Rubik', 'Segoe UI', Arial, sans-serif;
  direction: rtl;
  background: #F4F6FB;
  color: #1A1A2E;
  font-size: 16px;
  line-height: 1.85;
  padding: 0;
}

/* Drop zone */
#dropZone {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.drop-card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  padding: 60px 40px;
  max-width: 460px;
  width: 100%;
  text-align: center;
  border: 2px dashed #CBD5E1;
  transition: border-color 0.2s, background 0.2s;
  cursor: pointer;
}
.drop-card.dragover { border-color: #00B5AD; background: #F0FDFA; }
.drop-card h1 { font-size: 24px; font-weight: 700; color: #1B2E6E; margin-bottom: 8px; }
.drop-card p { font-size: 15px; color: #6B7280; margin-bottom: 24px; }
.drop-card .btn {
  display: inline-block;
  background: #1B2E6E;
  color: #fff;
  padding: 10px 28px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  border: none;
  transition: background 0.15s;
}
.drop-card .btn:hover { background: #122050; }

#fileInput { display: none; }

.paste-section {
  margin-top: 24px;
  width: 100%;
}

#pasteArea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  border: 1px solid #E5E7EB;
  border-radius: 8px;
  font-family: 'Rubik', 'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  direction: rtl;
  resize: vertical;
  color: #1A1A2E;
  background: #F8FAFC;
  transition: border-color 0.2s;
}
#pasteArea:focus { outline: none; border-color: #00B5AD; }
#pasteArea::placeholder { color: #9CA3AF; }

.btn-paste {
  margin-top: 10px;
  background: #00B5AD !important;
}
.btn-paste:hover { background: #008F88 !important; }

/* Content view */
#viewer {
  display: none;
  max-width: 860px;
  margin: 0 auto;
  padding: 40px 48px 80px;
  background: #fff;
  min-height: 100vh;
  box-shadow: 0 0 40px rgba(0,0,0,0.05);
}

#fileName {
  font-size: 13px;
  color: #6B7280;
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 1px solid #E5E7EB;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

#backBtn {
  background: none;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  padding: 4px 14px;
  font-family: inherit;
  font-size: 13px;
  color: #6B7280;
  cursor: pointer;
  transition: background 0.15s;
}
#backBtn:hover { background: #F4F6FB; }

.toolbar-actions { display: flex; gap: 8px; align-items: center; }

.tool-btn {
  background: none;
  border: 1px solid #E5E7EB;
  border-radius: 6px;
  padding: 4px 14px;
  font-family: inherit;
  font-size: 13px;
  color: #6B7280;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.tool-btn:hover { background: #F4F6FB; }
.tool-btn.primary { background: #00B5AD; color: #fff; border-color: #00B5AD; }
.tool-btn.primary:hover { background: #008F88; }
.tool-btn.active { background: #1B2E6E; color: #fff; border-color: #1B2E6E; }

/* Edit mode: edit the rendered document directly (like Word) */
#mdContent[contenteditable="true"] {
  outline: none;
  background: #FCFDFF;
  border: 1px dashed #CBD5E1;
  border-radius: 8px;
  padding: 20px 24px;
  min-height: 60vh;
}
#mdContent[contenteditable="true"]:focus {
  border-color: #00B5AD;
  border-style: solid;
}

/* Markdown styles */
.md h1 {
  font-size: 28px;
  font-weight: 700;
  color: #1B2E6E;
  border-bottom: 3px solid #00B5AD;
  padding-bottom: 10px;
  margin: 1.8em 0 0.7em;
  line-height: 1.3;
}
.md h1:first-child { margin-top: 0; }

.md h2 {
  font-size: 22px;
  font-weight: 600;
  color: #122050;
  margin: 1.6em 0 0.5em;
  padding-bottom: 6px;
  border-bottom: 1px solid #E5E7EB;
  line-height: 1.35;
}

.md h3 {
  font-size: 18px;
  font-weight: 500;
  color: #1A1A2E;
  margin: 1.3em 0 0.4em;
}

.md h4 {
  font-size: 16px;
  font-weight: 500;
  color: #6B7280;
  margin: 1.1em 0 0.3em;
}

.md p { margin: 0.7em 0; }

.md ul, .md ol {
  padding-inline-start: 24px;
  margin: 0.5em 0;
}

.md li {
  margin: 0.3em 0;
  line-height: 1.8;
}

.md strong { font-weight: 600; }

.md a {
  color: #008F88;
  text-decoration: underline;
  text-underline-offset: 2px;
}

.md blockquote {
  border-inline-start: 4px solid #00B5AD;
  background: #F0FDFA;
  padding: 12px 20px;
  margin: 1em 0;
  border-radius: 0 6px 6px 0;
}

.md code {
  background: #F1F5F9;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: 'Consolas', 'Courier New', monospace;
  font-size: 0.88em;
  direction: ltr;
  unicode-bidi: embed;
}

.md pre {
  background: #1E293B;
  color: #E2E8F0;
  padding: 16px 20px;
  border-radius: 6px;
  overflow-x: auto;
  margin: 1em 0;
  direction: ltr;
  text-align: left;
}
.md pre code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: 13px;
  line-height: 1.6;
}

.md table {
  width: 100%;
  border-collapse: collapse;
  margin: 1em 0;
  font-size: 14px;
}
.md th {
  background: #1B2E6E;
  color: #fff;
  font-weight: 500;
  padding: 10px 14px;
  text-align: right;
}
.md td {
  padding: 9px 14px;
  border-bottom: 1px solid #E5E7EB;
  text-align: right;
}
.md tr:nth-child(even) { background: #F8FAFC; }

.md hr {
  border: none;
  border-top: 1px solid #E5E7EB;
  margin: 2em 0;
}

.md img {
  max-width: 100%;
  border-radius: 6px;
}

@media print {
  #fileName { display: none; }
  #viewer { box-shadow: none; padding: 0; }
  body { background: #fff; }
}

@media (max-width: 640px) {
  #viewer { padding: 24px 20px 60px; }
}
</style>
</head>
<body>

<div id="dropZone">
  <div class="drop-card" id="dropCard">
    <h1>קורא מסמכים</h1>
    <p>גררו קובץ MD לכאן, לחצו לבחור, או הדביקו טקסט למטה</p>
    <button class="btn" onclick="document.getElementById('fileInput').click()">בחירת קובץ</button>
    <input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple>
    <div class="paste-section">
      <textarea id="pasteArea" placeholder="הדביקו טקסט Markdown כאן..."></textarea>
      <button class="btn btn-paste" onclick="renderPasted()">הצג</button>
    </div>
  </div>
</div>

<div id="viewer">
  <div id="fileName">
    <span id="fileNameText"></span>
    <div class="toolbar-actions">
      <button id="editToggleBtn" class="tool-btn" onclick="toggleEdit()">עריכה</button>
      <button id="saveBtn" class="tool-btn primary" onclick="saveFile()" style="display:none;">שמירה כקובץ</button>
      <button id="backBtn" class="tool-btn" onclick="showDrop()">חזרה</button>
    </div>
  </div>
  <div id="mdContent" class="md"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown@7.2.0/dist/turndown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown-plugin-gfm@1.0.2/dist/turndown-plugin-gfm.js"></script>
<script>
marked.setOptions({ breaks: true, gfm: true });

const turndown = new TurndownService({
  headingStyle: 'atx',
  bulletListMarker: '-',
  codeBlockStyle: 'fenced',
  emDelimiter: '*'
});
if (window.turndownPluginGfm) {
  turndown.use(window.turndownPluginGfm.gfm);
}

const dropZone = document.getElementById('dropZone');
const dropCard = document.getElementById('dropCard');
const viewer = document.getElementById('viewer');
const mdContent = document.getElementById('mdContent');
const fileNameText = document.getElementById('fileNameText');
const fileInput = document.getElementById('fileInput');
const editToggleBtn = document.getElementById('editToggleBtn');
const saveBtn = document.getElementById('saveBtn');

let currentName = 'document.md';

function showFile(name, text) {
  currentName = name;
  mdContent.innerHTML = marked.parse(text);
  fileNameText.textContent = name;
  dropZone.style.display = 'none';
  viewer.style.display = 'block';
  exitEdit();
  window.scrollTo(0, 0);
  document.title = name.replace(/\.md$/i, '') + ' - MD Viewer';
}

function showDrop() {
  exitEdit();
  viewer.style.display = 'none';
  dropZone.style.display = 'flex';
  document.title = 'MD Viewer - קורא מסמכים';
}

function toggleEdit() {
  if (mdContent.isContentEditable) exitEdit();
  else enterEdit();
}

function enterEdit() {
  mdContent.setAttribute('contenteditable', 'true');
  editToggleBtn.textContent = 'סיום עריכה';
  editToggleBtn.classList.add('active');
  saveBtn.style.display = 'inline-block';
  mdContent.focus();
}

function exitEdit() {
  mdContent.setAttribute('contenteditable', 'false');
  editToggleBtn.textContent = 'עריכה';
  editToggleBtn.classList.remove('active');
  saveBtn.style.display = 'none';
}

function saveFile() {
  const md = turndown.turndown(mdContent.innerHTML);
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  let name = currentName;
  if (!/\.(md|markdown|txt)$/i.test(name)) name += '.md';
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleFiles(files) {
  const file = files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => showFile(file.name, reader.result);
  reader.readAsText(file);
}

function renderPasted() {
  const text = document.getElementById('pasteArea').value.trim();
  if (!text) return;
  showFile('טקסט מודבק', text);
}

fileInput.addEventListener('change', e => handleFiles(e.target.files));

dropCard.addEventListener('dragover', e => {
  e.preventDefault();
  dropCard.classList.add('dragover');
});
dropCard.addEventListener('dragleave', () => dropCard.classList.remove('dragover'));
dropCard.addEventListener('drop', e => {
  e.preventDefault();
  dropCard.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => {
  e.preventDefault();
  if (e.target.closest('#dropCard')) return;
  handleFiles(e.dataTransfer.files);
});
</script>
</body>
</html>
